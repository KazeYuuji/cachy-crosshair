<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E90FF"/><stop offset="100%" stop-color="#0a4a8a"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <!-- outer circle -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="white" stroke-width="18" opacity="0.95"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="white" stroke-width="36" opacity="0.15"/>
  <!-- cross -->
  <g stroke="white" stroke-linecap="round" filter="url(#glow)">
    <line x1="256" y1="96" x2="256" y2="196" stroke-width="22"/>
    <line x1="256" y1="316" x2="256" y2="416" stroke-width="22"/>
    <line x1="96" y1="256" x2="196" y2="256" stroke-width="22"/>
    <line x1="316" y1="256" x2="416" y2="256" stroke-width="22"/>
  </g>
  <!-- center dot -->
  <circle cx="256" cy="256" r="26" fill="#FF2D2D" stroke="white" stroke-width="6"/>
  <circle cx="256" cy="256" r="14" fill="white" opacity="0.9"/>
  <!-- gap highlight -->
  <circle cx="256" cy="256" r="54" fill="none" stroke="white" stroke-width="3" opacity="0.3" stroke-dasharray="8 8"/>
</svg>
